<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Quiz App | CodeAlpha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">CodeAlpha Project</p>
        <h1>Flashcard Quiz</h1>
        <p class="subtitle">Study smarter with customizable flashcards.</p>
      </div>
      <button id="addBtn" class="primary">+ Add Card</button>
    </header>

    <section class="stats">
      <span id="cardCount">0 cards</span>
      <span id="position">0 / 0</span>
    </section>

    <section class="card-area">
      <article id="flashcard" class="flashcard">
        <div class="card-label" id="cardLabel">Question</div>
        <div id="cardText" class="card-text">No flashcards yet.</div>
        <button id="showAnswerBtn" class="secondary">Show Answer</button>
      </article>

      <div class="navigation">
        <button id="prevBtn" class="secondary">← Previous</button>
        <button id="nextBtn" class="secondary">Next →</button>
      </div>

      <div class="actions">
        <button id="editBtn" class="outline">Edit</button>
        <button id="deleteBtn" class="danger">Delete</button>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="closeModal" class="close">×</button>
      <h2 id="modalTitle">Add Flashcard</h2>
      <form id="cardForm">
        <label for="question">Question</label>
        <textarea id="question" required placeholder="Enter your question"></textarea>

        <label for="answer">Answer</label>
        <textarea id="answer" required placeholder="Enter the answer"></textarea>

        <button class="primary" type="submit">Save Card</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
