<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator | CodeAlpha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p class="eyebrow">CodeAlpha Project</p>
    <h1>Random Quote Generator</h1>
    <p class="intro">A little inspiration, one click away.</p>

    <section class="quote-card">
      <div class="quote-mark">“</div>
      <blockquote id="quoteText">Click the button to discover a quote.</blockquote>
      <p id="author" class="author">— Ready when you are</p>
      <button id="newQuote" class="primary">New Quote</button>
    </section>

    <p id="counter" class="counter"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
